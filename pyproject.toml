[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantpilot-ai"
version = "1.0.0"
description = "AI-powered stock trading platform using reinforcement learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "QuantPilot Team"}
]

dependencies = [
    # === Web Framework ===
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",

    # === Database ===
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",

    # === Machine Learning ===
    "torch>=2.2.0",
    "stable-baselines3>=2.2.0",
    "sb3-contrib>=2.2.0",
    "gymnasium>=0.29.0",
    "scikit-learn>=1.4.0",

    # === Data & Finance ===
    "yfinance>=0.2.36",
    "python-binance>=1.0.19",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",

    # === NLP & Sentiment ===
    "transformers>=4.38.0",
    "sentencepiece>=0.2.0",

    # === Visualization ===
    "streamlit>=1.31.0",
    "plotly>=5.18.0",

    # === Utilities ===
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

gpu = [
    "torch>=2.2.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
